version: '3.8'

services:
  medeye3d-gui:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: medeye3d-gui
    environment:
      - DISPLAY=${DISPLAY}
      - JULIA_NUM_THREADS=auto,1
      - HDF5_USE_FILE_LOCKING=FALSE
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /mnt/big/project_ssd/project_ssd:/mnt/big/project_ssd/project_ssd
      - .:/workspace
    network_mode: host
    command: bash -c "julia --threads=auto,1 --project=/workspace scripts/app/run_interactive_mrb.jl"

  medeye3d-ai:
    build:
      context: scripts/ai
      dockerfile: Dockerfile
    container_name: medeye3d-ai
    shm_size: '64gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /mnt/big/project_ssd/project_ssd:/mnt/big/project_ssd/project_ssd
      - /home/jm:/home/jm
    network_mode: host
